<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251b" />
    <meta name="description" content="RescueBite connects surplus food donors, NGOs, and volunteers to coordinate food rescue." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RescueBite | Food Rescue</title>
    <style>
      .boot-error { box-sizing:border-box; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f4f5ef; font:15px/1.7 system-ui,sans-serif; color:#183c2d; }
      .boot-error-card { max-width:420px; padding:40px 28px; border:1px solid #e1e8de; border-radius:22px; background:white; text-align:center; }
      .boot-error-symbol { display:grid; place-items:center; width:76px; height:76px; margin:0 auto 24px; background:#eef2e5; border-radius:50%; font-size:30px; color:#176b4d; animation:boot-arrive .5s ease-out; }
      .boot-error h1 { font-size:26px; line-height:1.2; letter-spacing:-.04em; }.boot-error p { color:#526159; font-size:14px; }
      .boot-error button { min-height:46px; margin-top:12px; padding:12px 20px; border:0; border-radius:10px; background:#176b4d; color:white; font:600 14px system-ui; cursor:pointer; }.boot-error button:focus-visible { outline:3px solid #176b4d; outline-offset:4px; }
      @keyframes boot-arrive { from { opacity:.3; transform:translateY(8px); } to { opacity:1; transform:none; } }
      @media(prefers-reduced-motion:reduce) { .boot-error-symbol { animation:none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        if (!event.target || !/^(SCRIPT|LINK)$/.test(event.target.tagName)) return
        var root = document.getElementById('root')
        if (!root || root.childElementCount) return
        root.innerHTML = '<main class="boot-error"><div class="boot-error-card"><span class="boot-error-symbol" aria-hidden="true">↻</span><div role="alert"><h1>A small pause in the journey.</h1><p>A site file didn’t finish downloading. Check your connection, then reload RescueBite.</p></div><button onclick="location.reload()">Reload site</button></div></main>'
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
