<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251b" />
    <meta name="description" content="FoodBridge connects surplus food donors, NGOs, and volunteers to coordinate food rescue." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FoodBridge | Food Rescue</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        if (!event.target || !/^(SCRIPT|LINK)$/.test(event.target.tagName)) return
        var root = document.getElementById('root')
        if (!root || root.childElementCount) return
        root.innerHTML = '<main style="max-width:32rem;margin:12vh auto;padding:2rem;font:16px system-ui;color:#10251b"><h1>RescueBite could not load</h1><p>A site file did not finish downloading. Check your connection and try again.</p><button onclick="location.reload()" style="padding:12px 20px;background:#10251b;color:white;border:0;border-radius:8px;cursor:pointer">Reload site</button></main>'
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
